<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Tamer Academy - تعلم البرمجة باحتراف">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tamer Academy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Tamer Academy</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0B1120;
      overflow: hidden;
    }
    #loading {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      background: #0B1120;
      transition: opacity 0.4s ease;
    }
    #loading.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    #loading-inner {
      text-align: center;
      color: white;
    }
    #loading-inner img {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(201, 168, 106, 0.4);
    }
    #loading-inner h1 {
      font-size: 26px;
      font-weight: 900;
      margin: 0 0 20px 0;
      letter-spacing: 1px;
      font-family: system-ui, sans-serif;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(201, 168, 106, 0.3);
      border-top: 4px solid #C9A86A;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div id="loading-inner">
      <img src="assets/assets/logo.png" alt="Tamer Academy" onerror="this.onerror=null;this.src='assets/logo.png'">
      <h1>Tamer Academy</h1>
      <div class="spinner"></div>
    </div>
  </div>

  <script>
    var _splashHidden = false;
    var _splashReady = false;

    // Continuously force flt-glass-pane hidden until app is ready
    var _guard = setInterval(function() {
      if (_splashReady) { clearInterval(_guard); return; }
      var gp = document.querySelector('flt-glass-pane');
      if (gp) {
        gp.style.setProperty('opacity', '0', 'important');
        gp.style.setProperty('visibility', 'hidden', 'important');
      }
    }, 5);

    // MutationObserver: catch flt-glass-pane as soon as it's created
    var _obs = new MutationObserver(function(mutations) {
      if (_splashReady) return;
      for (var i = 0; i < mutations.length; i++) {
        var nodes = mutations[i].addedNodes;
        for (var j = 0; j < nodes.length; j++) {
          var n = nodes[j];
          if (n.nodeName && n.nodeName.toLowerCase() === 'flt-glass-pane') {
            n.style.setProperty('opacity', '0', 'important');
            n.style.setProperty('visibility', 'hidden', 'important');
          }
          if (n.querySelectorAll) {
            var panes = n.querySelectorAll('flt-glass-pane');
            for (var k = 0; k < panes.length; k++) {
              panes[k].style.setProperty('opacity', '0', 'important');
              panes[k].style.setProperty('visibility', 'hidden', 'important');
            }
          }
        }
      }
    });
    _obs.observe(document.documentElement, { childList: true, subtree: true });

    // When Flutter first frame is ready, show the app and remove our splash
    window.addEventListener('flutter-first-frame', function () {
      _splashReady = true;
      clearInterval(_guard);
      _obs.disconnect();

      var gp = document.querySelector('flt-glass-pane');
      if (gp) {
        gp.style.setProperty('visibility', '', 'important');
        gp.style.setProperty('opacity', '1', 'important');
      }

      var el = document.getElementById('loading');
      if (el) {
        el.classList.add('fade-out');
        setTimeout(function() { el.remove(); }, 500);
      }
    });

    // Safety fallback after 12 seconds
    setTimeout(function() {
      if (!_splashReady) {
        _splashReady = true;
        clearInterval(_guard);
        _obs.disconnect();
        var gp = document.querySelector('flt-glass-pane');
        if (gp) {
          gp.style.setProperty('visibility', '', 'important');
          gp.style.setProperty('opacity', '1', 'important');
        }
        var el = document.getElementById('loading');
        if (el) {
          el.classList.add('fade-out');
          setTimeout(function() { el.remove(); }, 500);
        }
      }
    }, 12000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
